{{- if and .Values.auth.enabled (not .Values.auth.existingSecret) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "radar.secretName" . }}
  labels:
    {{- include "radar.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{ .Values.auth.tokenKey }}: {{ required "auth.token is required when auth.enabled and no existingSecret is set" .Values.auth.token | quote }}
{{- end }}
