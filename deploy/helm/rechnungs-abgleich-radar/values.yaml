replicaCount: 1

image:
  repository: ghcr.io/example/rechnungs-abgleich-radar
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  host: radar.example.com
  annotations: {}
  tls: []

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

persistence:
  enabled: true
  size: 1Gi
  storageClass: ""
  accessModes:
    - ReadWriteOnce

config:
  tolerancePct: "2"
  priceDriftPct: "2"
  duplicateWindowDays: "45"
  reviewMinutesPerFinding: "4"
  reviewHourlyRateEur: "45"
  # Society assigned to new invoices without an explicit ``entity``. Informational
  # only: existing/imported invoices keep their own entity and the database
  # default stays ``default``.
  defaultEntity: "default"
  # Cost center assigned to new invoices without an explicit ``cost_center``.
  # Informational only: existing/imported invoices keep their own cost center;
  # empty (the default) means no cost center is assigned.
  defaultCostCenter: ""

auth:
  enabled: false
  existingSecret: ""
  tokenKey: api-token
  token: ""

digest:
  webhookUrl: ""
  schedule: ""
  smtp:
    host: ""
    port: 587
    user: ""
    from: ""
    to: ""
    useTls: true
    existingSecret: ""
    passwordKey: smtp-password
    password: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []
affinity: {}
